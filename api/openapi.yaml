openapi: 3.0.3
info:
  title: English Pass API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Вход по логину и паролю
      description: При успехе ставит cookie сессии (HttpOnly, Secure, SameSite=Strict).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Вход выполнен, cookie установлена
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Слишком много неудачных попыток, повторите позже
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервер занят проверкой паролей, повторите позже
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Выход (идемпотентный)
      responses:
        "204":
          description: Сессия отозвана, cookie стёрта
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Текущий пользователь
      responses:
        "200":
          description: Пользователь вошёл
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Настройки обучения текущего пользователя
      responses:
        "200":
          description: Настройки сохранены ранее
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Настроек ещё нет, нужно пройти онбординг (код onboarding_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putSettings
      summary: Сохранить настройки обучения (создаёт или заменяет целиком)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Настройки сохранены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sources:
    get:
      operationId: listSources
      summary: Загруженные источники данных с лицензиями и атрибуцией
      description: Только источники, импорт которых завершён.
      responses:
        "200":
          description: Список источников (может быть пустым)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/words:
    get:
      operationId: searchWords
      summary: Поиск слова по началу (без учёта регистра)
      description: >
        Строка поиска передаётся в query-параметре `q` (до 64 символов; он не объявлен как parameters,
        потому что генератор тогда требует новую зависимость, и сервер читает его сам).
        Ищет по началу слова и по началу любого варианта через слэш. Пустой запрос даёт пустой список.
        Не больше 50 результатов: точное совпадение, затем по началу слова, затем по алфавиту.
      responses:
        "200":
          description: Найденные слова (может быть пусто)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/words/examples:
    get:
      operationId: listWordExamples
      summary: Примеры предложений для слова (из Tatoeba)
      description: >
        Параметры в query: `lemma` (слово как в списке, до 64 символов) и `pos` (часть речи, до 32 символов);
        они не объявлены как parameters, потому что генератор тогда требует новую зависимость, и сервер читает их сам.
        Формы слова строятся по правилам (без лемматизатора), поэтому неправильные формы редких слов и омонимы
        не различаются. Не больше 5 примеров: предложения из 4–12 слов, ближе к 8, с самым коротким переводом.
      responses:
        "200":
          description: Примеры (может быть пусто)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/cards:
    post:
      operationId: addCard
      summary: Добавить слово в карточки
      description: >
        Слово ищется по точной паре (лемма, часть речи). Без подходящих примеров предложений карточку не собрать
        (409 no_examples). Повторное добавление не создаёт вторую карточку (created: false).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCardRequest"
      responses:
        "200":
          description: Карточка уже была
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddCardResponse"
        "201":
          description: Карточка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddCardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Такого слова нет в словаре (код word_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Для слова нет подходящих примеров (код no_examples)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cards/queue:
    get:
      operationId: getCardQueue
      summary: Очередь карточек на сейчас
      responses:
        "200":
          description: Сколько карточек к повторению и следующая (если есть)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/cards/review:
    post:
      operationId: reviewCard
      summary: Оценить карточку
      description: >
        Номер карточки в теле, а не в пути: параметры пути заставляют генератор добавить новую зависимость.
        Повтор запроса с тем же key не применяет оценку второй раз. Ответ — очередь после оценки.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCardRequest"
      responses:
        "200":
          description: Оценка применена (или уже была применена с этим ключом)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardQueue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Карточки нет или она чужая
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/exercises/next:
    get:
      operationId: getNextExercise
      summary: Следующее упражнение
      description: >
        Упражнение с пропуском: предложение, перевод-подсказка и варианты ответа (пустой список — ввод вручную).
        Верного ответа в теле нет. Если подходящего не нашлось, 404 с кодом no_exercise. Режим «Привал» включается
        параметром mode=camp в строке запроса (читается без объявления в контракте: параметр запроса заставил бы
        генератор добавить новую зависимость): только предложения, где не меньше camp_coverage слов изучено. Пока
        изучено меньше campMinWords слов, 404 с кодом camp_closed.
      responses:
        "200":
          description: Упражнение
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Подходящего упражнения нет (код no_exercise)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/exercises/answer:
    post:
      operationId: answerExercise
      summary: Ответить на упражнение
      description: >
        Номер упражнения в теле, а не в пути: параметры пути заставляют генератор добавить новую зависимость.
        Повтор с тем же key возвращает тот же результат и ничего не пересчитывает. Ответ на уже отвеченное
        упражнение с другим key даёт 409 already_answered. При повторе по тому же ключу тело запроса игнорируется,
        correct и answer — как в первом ответе, ratings — текущие.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: Результат (или тот же результат при повторе с тем же ключом)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400":
          description: Некорректный запрос или пустой ответ (код invalid_request или invalid_answer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Упражнения нет или оно чужое (код not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: На упражнение уже отвечали с другим ключом (код already_answered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/learn/status:
    get:
      operationId: getLearnStatus
      summary: Состояние «Знакомства»
      description: >
        Сколько слов изучено и введено, дневной лимит новых слов, сколько ещё можно сегодня и почему так (причина лимита).
        kbReady — собрана ли база знаний (без неё блоков для знакомства нет).
      responses:
        "200":
          description: Состояние
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Настройки ещё не заполнены (onboarding_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/learn/block:
    get:
      operationId: getLearnBlock
      summary: Блок слов для знакомства
      description: >
        До семи новых слов (не больше остатка дневного лимита) с переводом, транскрипцией, звуком и примерами. Лимит
        исчерпан или просрочено слишком много карточек — 200 с пустым списком и причиной. Подходящих слов нет — 404 no_words.
      responses:
        "200":
          description: Блок слов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnBlock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Подходящих слов нет (no_words) или настройки не заполнены (onboarding_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/learn/introduce:
    post:
      operationId: introduceWords
      summary: Ввести слова после знакомства
      description: >
        Создаёт карточки для слов блока и помечает слова как введённые. Повтор запроса с тем же key ничего не меняет и
        отдаёт прежний результат. Больше остатка дневного лимита — 409 limit_reached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntroduceRequest"
      responses:
        "200":
          description: Слова введены (или уже были введены с этим ключом)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntroduceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Дневной лимит новых слов исчерпан (limit_reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/learn/placement:
    get:
      operationId: getPlacement
      summary: Страница быстрого теста «знаю / не знаю»
      description: >
        До 50 самых частых слов уровня, которых ещё нет ни в карточках, ни в состоянии изучения. Сколько слов
        пропустить, задаётся числом skip в строке запроса (читается без объявления в контракте: параметр запроса
        заставил бы генератор добавить новую зависимость). Слова, отмеченные «знаю», из списка пропадают, а «не знаю»
        остаются, поэтому следующую страницу просят с skip, равным числу «не знаю» на уже показанных страницах.
      responses:
        "200":
          description: Страница слов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Настройки не заполнены (onboarding_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: submitPlacement
      summary: Отправить ответы быстрого теста
      description: >
        Отмеченные «знаю» слова становятся изученными (без карточек). Повтор запроса с тем же key ничего не меняет.
        Ответ подсказывает, что делать дальше: more — показать следующую страницу (знакомых не меньше 80 %), stop — тест
        не нужен (меньше 50 %), learn — перейти к знакомству.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementRequest"
      responses:
        "200":
          description: Ответы приняты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/learn/preferences:
    get:
      operationId: getLearnPreferences
      summary: Настройки обучения
      description: Режим новых слов, число в день и покрытие «Привала»; до первого сохранения — значения по умолчанию.
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putLearnPreferences
      summary: Сохранить настройки обучения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnPreferences"
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/exercises/topics:
    get:
      operationId: listExerciseTopics
      summary: Темы с рейтингом
      responses:
        "200":
          description: Рейтинги тем пользователя (для полосы слабых тем)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/mistakes:
    get:
      operationId: listMistakes
      summary: Банк ошибок
      description: Открытые ошибки по сроку повтора (не больше 200) и счётчики
      responses:
        "200":
          description: Открытые ошибки пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MistakeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/sheets:
    get:
      operationId: listSheets
      summary: Список шпаргалок
      description: >
        Все шпаргалки с признаком избранного, статусом (draft — не проверена пользователем, reviewed — он нажал
        «Проверено») и числом «моих слабых» строк (трудные слова и слабые темы).
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/sheets/open:
    post:
      operationId: openSheet
      summary: Открыть шпаргалку
      description: >
        Тело шпаргалки с подмешанными данными пользователя: статусы слов и тем в привязанных таблицах, для
        mine-mistakes строки из банка ошибок. Запоминает время открытия. Номер шпаргалки в теле, не в пути:
        параметр пути заставил бы генератор добавить новую зависимость.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetRef"
      responses:
        "200":
          description: Шпаргалка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sheet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Такой шпаргалки нет (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sheets/favorite:
    put:
      operationId: setSheetFavorite
      summary: Закрепить или открепить шпаргалку
      description: Повтор с тем же значением ничего не меняет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetFavoriteRequest"
      responses:
        "200":
          description: Состояние после запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetFavoriteRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Такой шпаргалки нет (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sheets/review:
    post:
      operationId: reviewSheet
      summary: Отметить шпаргалку проверенной
      description: Пользователь сверил текст и подтверждает его. Отметка ставится один раз; повтор ничего не меняет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetRef"
      responses:
        "200":
          description: Шпаргалка теперь проверена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetReviewed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Такой шпаргалки нет (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/texts/next:
    get:
      operationId: getNextText
      summary: Следующий текст для чтения или слушания
      description: >
        Собирает текст из предложений Tatoeba так, чтобы ученик понимал около goal слов (по умолчанию 85 %, настройка
        80–90 %), с несколькими (обычно 3–6) новыми словами, каждое минимум дважды. Пока предыдущий текст не оценён
        (и ему меньше 12 часов), отдаётся он же; параметр new=1 в строке запроса собирает новый. Режим mode=read или mode=listen читается из строки запроса
        без объявления в контракте (параметр запроса заставил бы генератор добавить новую зависимость); любое другое
        значение — read. Собрать текст нельзя (мало известных слов или предложений) — 404 no_text.
      responses:
        "200":
          description: Текст
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadText"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Текст собрать нельзя (no_text)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/texts/rate:
    post:
      operationId: rateText
      summary: Как понял текст
      description: >
        Ответ easy («почти всё»), ok или hard («трудно») двигает цель понимания на 2 п. п. в границах 80–90 %.
        Текст оценивается один раз: повтор запроса цель не двигает.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateTextRequest"
      responses:
        "200":
          description: Оценка принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateTextResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Такого текста нет (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/texts/know-word:
    post:
      operationId: knowTextWord
      summary: Отметить слово из текста известным
      description: Слово получает состояние known_at_start. Слово, у которого уже есть карточка или состояние изучения, не меняется (marked = false).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowWordRequest"
      responses:
        "200":
          description: Результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowWordResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Такого слова нет в базе знаний (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/level/suggestion:
    get:
      operationId: getLevelSuggestion
      summary: Предложение сменить уровень
      description: >
        Смотрит на последние 30 ответов (за 60 суток) на упражнения уровня из настроек. 27 верных и больше —
        предлагает уровень выше, 12 и меньше — ниже. Меньше 30 ответов, край шкалы или недавний отказ
        (14 суток) — поля `suggestion` нет. Только предлагает: уровень пользователь меняет сам через настройки.
        Ничего не записывает.
      responses:
        "200":
          description: Предложение или пустой объект
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelSuggestionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/level/suggestion/dismiss:
    post:
      operationId: dismissLevelSuggestion
      summary: Спрятать предложение сменить уровень на 14 суток
      description: Пишет событие `level.suggestion.dismissed` (миграций нет). Повторный вызов только продлевает срок.
      responses:
        "204":
          description: Предложение спрятано
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/progress/today:
    get:
      operationId: getProgressToday
      summary: Прогресс за сегодня
      description: >
        Минуты занятий за сутки (по времени между ответами), «минимальный день», серия и счётчики дня.
        Считается из журнала событий, сутки — в часовом поясе настроек (без настроек UTC). Ничего не записывает.
      responses:
        "200":
          description: Прогресс за сегодня
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressToday"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/progress/overview:
    get:
      operationId: getProgressOverview
      summary: Обзор прогресса
      description: >
        Факты для страницы «Прогресс»: с какого дня занимаешься, сколько минут набрано, средний темп за 14 суток
        и накопленные часы по суткам за последние 90. Прогноз срока считает клиент. Считается из журнала событий
        (окно 365 суток), сутки в часовом поясе настроек (без настроек UTC). Ничего не записывает.
      responses:
        "200":
          description: Обзор прогресса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/milestones:
    get:
      operationId: getMilestones
      summary: Вехи
      description: >
        Вехи занятий: серия, часы, ответы, «первое». Считаются из журнала событий (окно 365 суток), сутки в
        часовом поясе настроек (без настроек UTC). `newToday` — вехи, достигнутые сегодня (для «вспышки успеха»
        в итоге дня). Ничего не записывает и не хранит.
      responses:
        "200":
          description: Вехи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneList"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  schemas:
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 256
    Me:
      type: object
      required: [login]
      properties:
        login:
          type: string
    Level:
      type: string
      enum: [A1, A2, B1, B2, C1]
    LearnReason:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
          enum: [manual, backlog, hard, easy, base, done, cold]
          description: Почему дневной лимит новых слов такой
        text:
          type: string
          description: Объяснение по-русски
    LearnStatus:
      type: object
      required: [learned, introduced, knownAtStart, newToday, limit, remaining, reason, mode, perDay, kbReady, campWords, campMinWords, campOpen, trackedWords, textMinWords]
      properties:
        learned:
          type: integer
          description: Слов изучено (вспомнены хорошо)
        introduced:
          type: integer
          description: Слов введено, но ещё не вспомнено хорошо
        knownAtStart:
          type: integer
          description: Слов отмечено «знаю» в быстром тесте
        newToday:
          type: integer
          description: Слов введено сегодня (сутки по часовому поясу настроек)
        limit:
          type: integer
        remaining:
          type: integer
        reason:
          $ref: "#/components/schemas/LearnReason"
        mode:
          type: string
          enum: [auto, manual]
        perDay:
          type: integer
          description: Число слов в день из настроек (потолок в авто-режиме)
        kbReady:
          type: boolean
          description: Собрана ли база знаний
        campWords:
          type: integer
          description: Слов известно «Привалу» (изучено и отмечено «знаю»)
        campMinWords:
          type: integer
          description: Сколько слов нужно, чтобы «Привал» открылся
        campOpen:
          type: boolean
          description: Открыт ли «Привал»
        trackedWords:
          type: integer
          description: Слов в учёте (показано на «Знакомстве», изучено, отмечено «знаю»)
        textMinWords:
          type: integer
          description: Сколько слов в учёте нужно, чтобы «Читать» могло собрать первый текст
    LearnWord:
      type: object
      required: [lexemeId, lemma, pos, level, translations, forms, synonyms, examples]
      properties:
        lexemeId:
          type: integer
          format: int64
        lemma:
          type: string
        pos:
          type: string
        level:
          $ref: "#/components/schemas/CefrLevel"
        rank:
          type: integer
          minimum: 1
          description: Место слова по частоте (1 — самое частое); нет, если слова нет в списке
        translations:
          type: array
          items:
            type: string
          description: Русские переводы (до двух), основной первым
        ipa:
          type: string
          description: Транскрипция (IPA) без слэшей
        audioUrl:
          type: string
          description: Ссылка на звуковой файл Wikimedia Commons; нет, если звука нет
        forms:
          type: array
          items:
            type: string
        synonyms:
          type: array
          items:
            type: string
        examples:
          type: array
          description: До двух примеров Tatoeba (атрибуция в самом примере)
          items:
            $ref: "#/components/schemas/Example"
    LearnBlock:
      type: object
      required: [words, limit, remaining, reason]
      properties:
        words:
          type: array
          items:
            $ref: "#/components/schemas/LearnWord"
        limit:
          type: integer
        remaining:
          type: integer
        reason:
          $ref: "#/components/schemas/LearnReason"
    IntroduceRequest:
      type: object
      required: [lexemeIds, key]
      properties:
        lexemeIds:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: integer
            format: int64
        key:
          type: string
          maxLength: 64
          description: Ключ идемпотентности
    IntroduceResponse:
      type: object
      required: [introduced, cardIds]
      properties:
        introduced:
          type: integer
        cardIds:
          type: array
          items:
            type: integer
            format: int64
    PlacementWord:
      type: object
      required: [lexemeId, lemma, pos]
      properties:
        lexemeId:
          type: integer
          format: int64
        lemma:
          type: string
        pos:
          type: string
    PlacementPage:
      type: object
      required: [words, skip, hasMore]
      properties:
        words:
          type: array
          items:
            $ref: "#/components/schemas/PlacementWord"
        skip:
          type: integer
          description: Сколько слов пропущено (как в запросе)
        hasMore:
          type: boolean
    PlacementRequest:
      type: object
      required: [known, shown, key]
      properties:
        known:
          type: array
          maxItems: 50
          items:
            type: integer
            format: int64
        shown:
          type: array
          maxItems: 50
          items:
            type: integer
            format: int64
        key:
          type: string
          maxLength: 64
    PlacementResult:
      type: object
      required: [marked, next]
      properties:
        marked:
          type: integer
        next:
          type: string
          enum: [more, stop, learn]
    LearnPreferences:
      type: object
      required: [newWordsMode, newWordsPerDay, campCoverage]
      properties:
        newWordsMode:
          type: string
          enum: [auto, manual]
        newWordsPerDay:
          type: integer
          minimum: 1
          maximum: 30
        campCoverage:
          type: number
          minimum: 0.9
          maximum: 0.99
    CefrLevel:
      type: string
      description: Уровень слова в источниках; шкала цели пользователя (Level) кончается на C1, а у слов бывает и C2
      enum: [A1, A2, B1, B2, C1, C2]
    Settings:
      type: object
      required: [currentLevel, targetLevel, dailyMinutes, timezone]
      properties:
        currentLevel:
          $ref: "#/components/schemas/Level"
        targetLevel:
          $ref: "#/components/schemas/Level"
        targetDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          description: Календарный день цели (YYYY-MM-DD) или null
        dailyMinutes:
          type: integer
          minimum: 5
          maximum: 240
        timezone:
          type: string
          description: Часовой пояс IANA, например Europe/Moscow
    Source:
      type: object
      required: [name, version, license, url, attribution, rowCount, importedAt]
      properties:
        name:
          type: string
        version:
          type: string
        license:
          type: string
          description: Условия лицензии по-русски
        url:
          type: string
          description: Откуда скачан файл
        attribution:
          type: string
          description: Текст, который обязаны показать по лицензии
        rowCount:
          type: integer
        importedAt:
          type: string
          format: date-time
    SourceList:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
    WordLevel:
      type: object
      required: [source, level, notes]
      properties:
        source:
          type: string
          description: Имя источника (cefrj, octanove)
        level:
          $ref: "#/components/schemas/CefrLevel"
        notes:
          type: array
          description: Заметки источника о значении слова (если есть)
          items:
            type: string
    Word:
      type: object
      required: [lemma, pos, level, levels, inCards]
      properties:
        lemma:
          type: string
        pos:
          type: string
        inCards:
          type: boolean
          description: Есть ли у пользователя карточка этого слова
        frequencyRank:
          type: integer
          minimum: 1
          description: >
            Место слова в списке частот (1 — самое частое): лучшее среди его форм. Нет, если слова нет в списке
            (реже 50 000-го) или это фраза.
        level:
          $ref: "#/components/schemas/CefrLevel"
          description: Уровень слова — самый низкий из оценок источников
        levels:
          type: array
          description: Оценки по источникам
          items:
            $ref: "#/components/schemas/WordLevel"
        ipa:
          type: string
          description: Транскрипция (IPA) основного произношения из базы знаний; нет, если базы нет или слова в ней нет
        translations:
          type: array
          items:
            type: string
          description: Русские переводы (до двух), основной первым, из базы знаний; нет, если базы нет или перевода нет
        synonyms:
          type: array
          items:
            type: string
          description: Синонимы из базы знаний; нет, если их нет
    WordList:
      type: object
      required: [words]
      properties:
        words:
          type: array
          items:
            $ref: "#/components/schemas/Word"
    ExampleSentence:
      type: object
      required: [text, author, tatoebaId]
      properties:
        text:
          type: string
        author:
          type: string
          description: Автор предложения на Tatoeba (атрибуция по лицензии CC BY)
        tatoebaId:
          type: integer
          format: int64
          description: Номер предложения на tatoeba.org
    TextRange:
      type: object
      required: [start, end]
      properties:
        start:
          type: integer
          description: Начало в символах (не в байтах), включительно
        end:
          type: integer
          description: Конец в символах, не включается
    Example:
      type: object
      required: [en, ru]
      properties:
        en:
          $ref: "#/components/schemas/ExampleSentence"
        ru:
          $ref: "#/components/schemas/ExampleSentence"
        highlight:
          $ref: "#/components/schemas/TextRange"
          description: Где в английском предложении найденное слово; нет, если место определить не удалось
    ExampleList:
      type: object
      required: [examples]
      properties:
        examples:
          type: array
          items:
            $ref: "#/components/schemas/Example"
    AddCardRequest:
      type: object
      required: [lemma, pos]
      properties:
        lemma:
          type: string
          maxLength: 64
        pos:
          type: string
          maxLength: 32
    AddCardResponse:
      type: object
      required: [cardId, created]
      properties:
        cardId:
          type: integer
          format: int64
        created:
          type: boolean
    ReviewCardRequest:
      type: object
      required: [cardId, rating, key]
      properties:
        cardId:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 4
          description: 1 забыл, 2 трудно, 3 хорошо, 4 легко
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: Ключ идемпотентности; клиент создаёт новый для каждой показанной карточки
    CardSentence:
      type: object
      required: [en, ru, gap]
      properties:
        en:
          $ref: "#/components/schemas/ExampleSentence"
        ru:
          $ref: "#/components/schemas/ExampleSentence"
        gap:
          $ref: "#/components/schemas/TextRange"
          description: Где в английском предложении слово (его скрывает пропуск), в символах
    CardIntervals:
      type: object
      description: Через сколько секунд карточка вернётся при каждой оценке
      required: [again, hard, good, easy]
      properties:
        again:
          type: integer
          format: int64
        hard:
          type: integer
          format: int64
        good:
          type: integer
          format: int64
        easy:
          type: integer
          format: int64
    QueueCard:
      type: object
      required: [cardId, lemma, pos, level, state, intervals]
      properties:
        cardId:
          type: integer
          format: int64
        lemma:
          type: string
        pos:
          type: string
        level:
          $ref: "#/components/schemas/CefrLevel"
        state:
          type: integer
          description: 0 новая, 1 обучение, 2 повторение, 3 переобучение
        sentence:
          $ref: "#/components/schemas/CardSentence"
          description: Предложение с пропуском; нет, если подходящих примеров не нашлось
        intervals:
          $ref: "#/components/schemas/CardIntervals"
    CardQueue:
      type: object
      required: [dueCount, totalCount]
      properties:
        dueCount:
          type: integer
          format: int64
          description: Сколько карточек к повторению сейчас
        totalCount:
          type: integer
          format: int64
          description: Сколько карточек всего
        card:
          $ref: "#/components/schemas/QueueCard"
          description: Следующая карточка; нет, если повторять нечего
    Exercise:
      type: object
      required: [id, kind, prompt, translation, choices, topic]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [gap, order, form, match, translate]
          description: >
            Вид упражнения. gap — пропуск в предложении, order — собрать предложение из плиток,
            translate — перевести русское предложение (prompt) по-английски, ответ вводится вручную
            (choices пуст, tiles нет),
            form — выбрать верную форму слова (в prompt пропуск, в hint начальная форма),
            match — соединить пять английских слов (words) с пятью русскими переводами (options)
        prompt:
          type: string
          description: >
            gap — предложение с пропуском (английский); order — русское предложение, которое нужно перевести
            (собрать по-английски из tiles); translate — русское предложение, которое нужно перевести вводом
        translation:
          type: string
          description: Перевод-подсказка на русском (для translate всегда пустая строка, русская фраза лежит в prompt)
        choices:
          type: array
          items:
            type: string
          description: Варианты ответа; пустой список — ответ вводится вручную (для order всегда пустой)
        tiles:
          type: array
          items:
            type: string
          description: >
            Только для order: слова английского предложения в перемешанном порядке (первое слово строчное,
            завершающей точки нет). Верный порядок до ответа клиенту не отдаётся
        hint:
          type: string
          description: Только для form, начальная форма слова, которую нужно изменить
        words:
          type: array
          items:
            type: string
          description: Только для match, пять английских слов в фиксированном порядке
        options:
          type: array
          items:
            type: string
          description: Только для match, пять русских переводов вперемешку (верные пары до ответа клиенту не отдаются)
        topic:
          type: string
          description: Основная тема упражнения
        repeat:
          type: boolean
          description: Это повтор ошибки из банка ошибок
    AnswerRequest:
      type: object
      required: [exerciseId, given, key]
      properties:
        exerciseId:
          type: integer
          format: int64
        given:
          type: string
          minLength: 1
          maxLength: 400
          description: >
            Ответ пользователя; для order — собранное предложение строкой (слова через пробел),
            для match — пары строкой «слово=перевод;слово=перевод;…»
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: Ключ идемпотентности, один на попытку
    Rating:
      type: object
      required: [topic, rating, deviation, attempts]
      properties:
        topic:
          type: string
        rating:
          type: number
          format: double
        deviation:
          type: number
          format: double
        attempts:
          type: integer
          minimum: 0
    AnswerResult:
      type: object
      required: [correct, answer, translation, ratings]
      properties:
        correct:
          type: boolean
        answer:
          type: string
          description: Верный ответ
        translation:
          type: string
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/Rating"
          description: Рейтинги затронутых тем после обновления
        word:
          type: object
          required: [lemma, pos, inCards]
          description: Только для form, слово упражнения (чтобы добавить его в карточки)
          properties:
            lemma:
              type: string
            pos:
              type: string
            inCards:
              type: boolean
              description: Слово уже есть в карточках пользователя
        mistake:
          $ref: "#/components/schemas/MistakeResult"
        nearMiss:
          type: string
          description: >
            Только для translate: ответ принят с опечаткой в одну букву; здесь вариант, с которым он совпал
            («Правильно: …»)
        accepted:
          type: array
          items:
            type: string
          description: >
            Только для translate — другие допустимые переводы, до трёх (без основного и без совпавшего)
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/PairResult"
          description: Только для match, разбор каждой пары (в порядке слов упражнения)
    PairResult:
      type: object
      required: [word, given, answer, correct]
      properties:
        word:
          type: string
        given:
          type: string
          description: Перевод, который выбрал пользователь
        answer:
          type: string
          description: Верный перевод
        correct:
          type: boolean
    MistakeResult:
      type: object
      required: [status, streak, nextDue]
      description: Состояние ошибки после ответа (повтор или новый неверный ответ)
      properties:
        status:
          type: string
          enum: [open, closed]
        streak:
          type: integer
          minimum: 0
          maximum: 2
          description: Верных повторов подряд
        nextDue:
          type: string
          format: date-time
          description: Когда ошибка вернётся (для закрытой — последний срок)
    Mistake:
      type: object
      required: [id, topic, kind, prompt, given, answer, streak, nextDue, firstWrongAt]
      properties:
        id:
          type: integer
          format: int64
        topic:
          type: string
          description: Основная тема ошибки
        kind:
          type: string
          description: Вид упражнения (gap, order, form или translate, как у Exercise.kind)
        prompt:
          type: string
          description: Предложение с пропуском (gap, form) или русский перевод (order, translate)
        given:
          type: string
          description: Последний неверный ответ
        answer:
          type: string
          description: Верный ответ
        streak:
          type: integer
          minimum: 0
          maximum: 2
        nextDue:
          type: string
          format: date-time
        firstWrongAt:
          type: string
          format: date-time
    MistakeCounts:
      type: object
      required: [open, dueNow, closedThisWeek]
      properties:
        open:
          type: integer
          format: int64
          description: Все открытые ошибки (не только показанные)
        dueNow:
          type: integer
          format: int64
          description: Ждут повтора сейчас
        closedThisWeek:
          type: integer
          format: int64
    MistakeList:
      type: object
      required: [open, counts]
      properties:
        open:
          type: array
          items:
            $ref: "#/components/schemas/Mistake"
          description: Открытые ошибки по сроку повтора, не больше 200
        counts:
          $ref: "#/components/schemas/MistakeCounts"
    TodayCounts:
      type: object
      required: [answers, correct, cardsReviewed, mistakesOpened, mistakesClosed]
      properties:
        answers:
          type: integer
          description: Ответов на упражнения за сегодня
        correct:
          type: integer
          description: Из них верных
        cardsReviewed:
          type: integer
        mistakesOpened:
          type: integer
        mistakesClosed:
          type: integer
    LevelSuggestion:
      type: object
      required: [direction, from, to, correct, total]
      properties:
        direction:
          type: string
          enum: [up, down]
        from:
          $ref: "#/components/schemas/Level"
        to:
          $ref: "#/components/schemas/Level"
        correct:
          type: integer
          description: Верных ответов среди последних `total`
        total:
          type: integer
          description: Сколько последних ответов учтено (30)
    SheetRef:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
    SheetFavoriteRequest:
      type: object
      additionalProperties: false
      required: [id, favorite]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        favorite:
          type: boolean
    SheetReviewed:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/SheetStatus"
    SheetStatus:
      type: string
      enum: [draft, reviewed]
      description: draft — текст не проверен пользователем, reviewed — он нажал «Проверено»
    SheetSummary:
      type: object
      required: [id, title, summary, level, tags, favorite, status, weakCount]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        level:
          type: string
          enum: [A1, A2, B1, B2, C1]
        tags:
          type: array
          items:
            type: string
        favorite:
          type: boolean
        status:
          $ref: "#/components/schemas/SheetStatus"
        weakCount:
          type: integer
          description: Строк «моих слабых» (трудные слова и слабые темы)
        openedAt:
          type: string
          format: date-time
          description: Когда шпаргалку открывали последний раз; нет, если не открывали
    SheetList:
      type: object
      required: [sheets]
      properties:
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/SheetSummary"
    Sheet:
      type: object
      required: [id, title, summary, level, tags, favorite, status, weakCount, sources, blocks]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        level:
          type: string
          enum: [A1, A2, B1, B2, C1]
        tags:
          type: array
          items:
            type: string
        favorite:
          type: boolean
        status:
          $ref: "#/components/schemas/SheetStatus"
        weakCount:
          type: integer
        sources:
          type: array
          items:
            type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/SheetBlock"
    SheetBlock:
      type: object
      required: [type]
      description: Заполнены только поля, нужные типу блока (text, table, tip, mistakes, examples).
      properties:
        type:
          type: string
          enum: [text, table, tip, mistakes, examples]
        title:
          type: string
        text:
          type: string
        bind:
          type: string
          enum: [word, topic, mistake]
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SheetColumn"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SheetRow"
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/SheetPair"
        examples:
          type: array
          items:
            $ref: "#/components/schemas/SheetExample"
    SheetColumn:
      type: object
      required: [title]
      properties:
        title:
          type: string
    SheetRow:
      type: object
      required: [cells]
      properties:
        key:
          type: string
        cells:
          type: array
          items:
            type: string
        needsCheck:
          type: boolean
        status:
          type: string
          enum: [unseen, introduced, learning, learned, known_at_start, hard, weak, ok]
          description: Для привязки word — статус слова; для topic — weak, ok или unseen
        rating:
          type: number
          description: Рейтинг темы (только привязка topic)
    SheetPair:
      type: object
      required: [wrong, right, note]
      properties:
        wrong:
          type: string
        right:
          type: string
        note:
          type: string
    SheetExample:
      type: object
      required: [en, ru]
      properties:
        en:
          type: string
        ru:
          type: string
    ReadText:
      type: object
      required: [id, mode, title, goal, coverage, cohesion, sentences, targets, hints, constructions]
      properties:
        id:
          type: integer
          format: int64
        mode:
          type: string
          enum: [read, listen]
        title:
          type: string
        goal:
          type: number
          description: Цель понимания (0,80–0,90)
        coverage:
          type: number
          description: Настоящее понимание этого текста (доля известных слов)
        cohesion:
          type: number
          description: Доля пар соседних предложений с общим словом
        sentences:
          type: array
          items:
            $ref: "#/components/schemas/ReadSentence"
        targets:
          type: array
          items:
            type: string
          description: Новые слова текста (леммы)
        hints:
          type: array
          items:
            $ref: "#/components/schemas/ReadWordHint"
        constructions:
          type: array
          description: Грамматические конструкции, найденные в тексте, с короткими пояснениями (считаются при выдаче, не хранятся)
          items:
            $ref: "#/components/schemas/ReadConstruction"
    ReadConstruction:
      type: object
      required: [id, title, form, explanation, exampleEn, exampleRu, sentences]
      properties:
        id:
          type: string
        title:
          type: string
        form:
          type: string
        explanation:
          type: string
        exampleEn:
          type: string
        exampleRu:
          type: string
        sheetId:
          type: string
          description: Шпаргалка по теме, если она есть
        sentences:
          type: array
          items:
            type: integer
          description: Номера предложений текста (с нуля), где конструкция найдена
    ReadSentence:
      type: object
      required: [tatoebaId, author, ruTatoebaId, ruAuthor, en, ru, tokens]
      properties:
        tatoebaId:
          type: integer
          format: int64
        author:
          type: string
          description: Автор английского предложения на Tatoeba (атрибуция CC BY)
        ruTatoebaId:
          type: integer
          format: int64
          description: Номер русского перевода на Tatoeba
        ruAuthor:
          type: string
          description: Автор русского перевода (атрибуция CC BY)
        en:
          type: string
        ru:
          type: string
        tokens:
          type: array
          items:
            type: string
          description: Слова предложения в исходном регистре, в порядке появления
    ReadWordHint:
      type: object
      required: [token, lexemeId, lemma, pos, translations, target]
      properties:
        token:
          type: string
          description: Слово в нижнем регистре, как оно встречается в тексте
        lexemeId:
          type: integer
          format: int64
        lemma:
          type: string
        pos:
          type: string
        translations:
          type: array
          items:
            type: string
        ipa:
          type: string
        target:
          type: boolean
          description: Новое слово этого текста
    RateTextRequest:
      type: object
      additionalProperties: false
      required: [textId, understood, mode]
      properties:
        textId:
          type: integer
          format: int64
        understood:
          type: string
          enum: [easy, ok, hard]
        mode:
          type: string
          enum: [read, listen]
    RateTextResult:
      type: object
      required: [goal, changed]
      properties:
        goal:
          type: number
          description: Цель понимания после ответа
        changed:
          type: boolean
          description: Оценка принята впервые (false — текст уже оценён)
    KnowWordRequest:
      type: object
      additionalProperties: false
      required: [lexemeId]
      properties:
        lexemeId:
          type: integer
          format: int64
    KnowWordResult:
      type: object
      required: [marked]
      properties:
        marked:
          type: boolean
    LevelSuggestionResponse:
      type: object
      properties:
        suggestion:
          $ref: "#/components/schemas/LevelSuggestion"
    ProgressToday:
      type: object
      required: [minutes, minimumDay, goalMinutes, doneToday, streakDays, today]
      properties:
        minutes:
          type: number
          description: Минут занятий за сегодня (одна десятая)
        minimumDay:
          type: integer
          description: Сколько минут нужно для «минимального дня»
        goalMinutes:
          type: integer
          description: Цель дня из настроек (без настроек 15)
        doneToday:
          type: boolean
        streakDays:
          type: integer
          description: Серия, сутки подряд с выполненным минимумом (не больше 60)
        freezeUsedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Последний пропуск, прощённый «заморозкой» (YYYY-MM-DD); нет поля, если заморозка не использовалась
        today:
          $ref: "#/components/schemas/TodayCounts"
    DailyPoint:
      type: object
      required: [day, minutes, cumulativeHours]
      properties:
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        minutes:
          type: number
          description: Минут занятий за сутки (одна десятая)
        cumulativeHours:
          type: number
          description: Часов занятий с самого начала до конца этих суток (одна тысячная)
    ProgressOverview:
      type: object
      required: [daysSinceStart, studiedMinutes, paceMinutesPerDay, paceReady, daily]
      properties:
        startedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Сутки первого занятия в окне (YYYY-MM-DD); нет поля, если занятий не было
        daysSinceStart:
          type: integer
          description: Сколько суток прошло с первого занятия, сегодня включительно (0, если занятий не было)
        studiedMinutes:
          type: number
          description: Всего минут занятий в окне 365 суток (одна десятая)
        paceMinutesPerDay:
          type: number
          description: Средний темп за последние 14 суток, включая пустые (одна десятая)
        paceReady:
          type: boolean
          description: Прошло не меньше 14 суток с первого занятия, темп можно показывать
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailyPoint"
          description: Последние 90 суток по порядку, без пропусков
    MilestoneProgress:
      type: object
      required: [value, target]
      properties:
        value:
          type: number
          description: Текущее значение в единицах порога (дни, часы, ответы), не больше порога
        target:
          type: number
          description: Порог вехи
    Milestone:
      type: object
      required: [id, kind, title, threshold, progress]
      properties:
        id:
          type: string
          description: Стабильный ключ (streak-7, hours-10, answers-100, first-card)
        kind:
          type: string
          description: streak, hours, answers или first
        title:
          type: string
        threshold:
          type: integer
        reachedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Первые сутки, когда веха достигнута (YYYY-MM-DD); нет поля, если не достигнута
        progress:
          $ref: "#/components/schemas/MilestoneProgress"
    MilestoneList:
      type: object
      required: [milestones, newToday]
      properties:
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
          description: Все вехи по порядку линеек и порогов
        newToday:
          type: array
          items:
            type: string
          description: id вех, достигнутых сегодня; самая крупная первой
    TopicList:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Rating"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Машинный код ошибки
              enum: [invalid_request, invalid_credentials, forbidden_origin, too_many_attempts, busy, unauthorized, onboarding_required, no_examples, word_not_found, not_found, no_exercise, no_words, no_text, camp_closed, limit_reached, already_answered, invalid_answer, internal]
            message:
              type: string
              description: Текст для пользователя на русском
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нет действующей сессии или неверные данные для входа
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Запрос с чужого источника (Origin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
