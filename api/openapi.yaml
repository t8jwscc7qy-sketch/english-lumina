openapi: 3.0.3
info:
  title: English Pass API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Вход по логину и паролю
      description: При успехе ставит cookie сессии (HttpOnly, Secure, SameSite=Strict).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Вход выполнен, cookie установлена
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Слишком много неудачных попыток, повторите позже
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервер занят проверкой паролей, повторите позже
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Выход (идемпотентный)
      responses:
        "204":
          description: Сессия отозвана, cookie стёрта
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Текущий пользователь
      responses:
        "200":
          description: Пользователь вошёл
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Настройки обучения текущего пользователя
      responses:
        "200":
          description: Настройки сохранены ранее
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Настроек ещё нет, нужно пройти онбординг (код onboarding_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putSettings
      summary: Сохранить настройки обучения (создаёт или заменяет целиком)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Настройки сохранены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  schemas:
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 256
    Me:
      type: object
      required: [login]
      properties:
        login:
          type: string
    Level:
      type: string
      enum: [A1, A2, B1, B2, C1]
    Settings:
      type: object
      required: [currentLevel, targetLevel, dailyMinutes, timezone]
      properties:
        currentLevel:
          $ref: "#/components/schemas/Level"
        targetLevel:
          $ref: "#/components/schemas/Level"
        targetDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          description: Календарный день цели (YYYY-MM-DD) или null
        dailyMinutes:
          type: integer
          minimum: 5
          maximum: 240
        timezone:
          type: string
          description: Часовой пояс IANA, например Europe/Moscow
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Машинный код ошибки
              enum: [invalid_request, invalid_credentials, forbidden_origin, too_many_attempts, busy, unauthorized, onboarding_required, internal]
            message:
              type: string
              description: Текст для пользователя на русском
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нет действующей сессии или неверные данные для входа
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Запрос с чужого источника (Origin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
