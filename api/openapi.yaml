openapi: 3.0.3
info:
  title: English Pass API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Вход по логину и паролю
      description: При успехе ставит cookie сессии (HttpOnly, Secure, SameSite=Strict).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Вход выполнен, cookie установлена
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Слишком много неудачных попыток, повторите позже
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Сервер занят проверкой паролей, повторите позже
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Выход (идемпотентный)
      responses:
        "204":
          description: Сессия отозвана, cookie стёрта
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Текущий пользователь
      responses:
        "200":
          description: Пользователь вошёл
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Настройки обучения текущего пользователя
      responses:
        "200":
          description: Настройки сохранены ранее
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Настроек ещё нет, нужно пройти онбординг (код onboarding_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putSettings
      summary: Сохранить настройки обучения (создаёт или заменяет целиком)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Настройки сохранены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sources:
    get:
      operationId: listSources
      summary: Загруженные источники данных с лицензиями и атрибуцией
      description: Только источники, импорт которых завершён.
      responses:
        "200":
          description: Список источников (может быть пустым)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/words:
    get:
      operationId: searchWords
      summary: Поиск слова по началу (без учёта регистра)
      description: >
        Строка поиска передаётся в query-параметре `q` (до 64 символов; он не объявлен как parameters,
        потому что генератор тогда требует новую зависимость, и сервер читает его сам).
        Ищет по началу слова и по началу любого варианта через слэш. Пустой запрос даёт пустой список.
        Не больше 50 результатов: точное совпадение, затем по началу слова, затем по алфавиту.
      responses:
        "200":
          description: Найденные слова (может быть пусто)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/words/examples:
    get:
      operationId: listWordExamples
      summary: Примеры предложений для слова (из Tatoeba)
      description: >
        Параметры в query: `lemma` (слово как в списке, до 64 символов) и `pos` (часть речи, до 32 символов);
        они не объявлены как parameters, потому что генератор тогда требует новую зависимость, и сервер читает их сам.
        Формы слова строятся по правилам (без лемматизатора), поэтому неправильные формы редких слов и омонимы
        не различаются. Не больше 5 примеров: предложения из 4–12 слов, ближе к 8, с самым коротким переводом.
      responses:
        "200":
          description: Примеры (может быть пусто)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/cards:
    post:
      operationId: addCard
      summary: Добавить слово в карточки
      description: >
        Слово ищется по точной паре (лемма, часть речи). Без подходящих примеров предложений карточку не собрать
        (409 no_examples). Повторное добавление не создаёт вторую карточку (created: false).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCardRequest"
      responses:
        "200":
          description: Карточка уже была
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddCardResponse"
        "201":
          description: Карточка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddCardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Такого слова нет в словаре (код word_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Для слова нет подходящих примеров (код no_examples)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cards/queue:
    get:
      operationId: getCardQueue
      summary: Очередь карточек на сейчас
      responses:
        "200":
          description: Сколько карточек к повторению и следующая (если есть)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/cards/review:
    post:
      operationId: reviewCard
      summary: Оценить карточку
      description: >
        Номер карточки в теле, а не в пути: параметры пути заставляют генератор добавить новую зависимость.
        Повтор запроса с тем же key не применяет оценку второй раз. Ответ — очередь после оценки.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCardRequest"
      responses:
        "200":
          description: Оценка применена (или уже была применена с этим ключом)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardQueue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Карточки нет или она чужая
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/exercises/next:
    get:
      operationId: getNextExercise
      summary: Следующее упражнение
      description: >
        Упражнение с пропуском: предложение, перевод-подсказка и варианты ответа (пустой список — ввод вручную).
        Верного ответа в теле нет. Если подходящего не нашлось, 404 с кодом no_exercise.
      responses:
        "200":
          description: Упражнение
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Подходящего упражнения нет (код no_exercise)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/exercises/answer:
    post:
      operationId: answerExercise
      summary: Ответить на упражнение
      description: >
        Номер упражнения в теле, а не в пути: параметры пути заставляют генератор добавить новую зависимость.
        Повтор с тем же key возвращает тот же результат и ничего не пересчитывает. Ответ на уже отвеченное
        упражнение с другим key даёт 409 already_answered. При повторе по тому же ключу тело запроса игнорируется,
        correct и answer — как в первом ответе, ratings — текущие.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: Результат (или тот же результат при повторе с тем же ключом)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400":
          description: Некорректный запрос или пустой ответ (код invalid_request или invalid_answer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Упражнения нет или оно чужое (код not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: На упражнение уже отвечали с другим ключом (код already_answered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/exercises/topics:
    get:
      operationId: listExerciseTopics
      summary: Темы с рейтингом
      responses:
        "200":
          description: Рейтинги тем пользователя (для полосы слабых тем)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/mistakes:
    get:
      operationId: listMistakes
      summary: Банк ошибок
      description: Открытые ошибки по сроку повтора (не больше 200) и счётчики
      responses:
        "200":
          description: Открытые ошибки пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MistakeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/progress/today:
    get:
      operationId: getProgressToday
      summary: Прогресс за сегодня
      description: >
        Минуты занятий за сутки (по времени между ответами), «минимальный день», серия и счётчики дня.
        Считается из журнала событий, сутки — в часовом поясе настроек (без настроек UTC). Ничего не записывает.
      responses:
        "200":
          description: Прогресс за сегодня
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressToday"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  schemas:
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 256
    Me:
      type: object
      required: [login]
      properties:
        login:
          type: string
    Level:
      type: string
      enum: [A1, A2, B1, B2, C1]
    CefrLevel:
      type: string
      description: Уровень слова в источниках; шкала цели пользователя (Level) кончается на C1, а у слов бывает и C2
      enum: [A1, A2, B1, B2, C1, C2]
    Settings:
      type: object
      required: [currentLevel, targetLevel, dailyMinutes, timezone]
      properties:
        currentLevel:
          $ref: "#/components/schemas/Level"
        targetLevel:
          $ref: "#/components/schemas/Level"
        targetDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          description: Календарный день цели (YYYY-MM-DD) или null
        dailyMinutes:
          type: integer
          minimum: 5
          maximum: 240
        timezone:
          type: string
          description: Часовой пояс IANA, например Europe/Moscow
    Source:
      type: object
      required: [name, version, license, url, attribution, rowCount, importedAt]
      properties:
        name:
          type: string
        version:
          type: string
        license:
          type: string
          description: Условия лицензии по-русски
        url:
          type: string
          description: Откуда скачан файл
        attribution:
          type: string
          description: Текст, который обязаны показать по лицензии
        rowCount:
          type: integer
        importedAt:
          type: string
          format: date-time
    SourceList:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
    WordLevel:
      type: object
      required: [source, level, notes]
      properties:
        source:
          type: string
          description: Имя источника (cefrj, octanove)
        level:
          $ref: "#/components/schemas/CefrLevel"
        notes:
          type: array
          description: Заметки источника о значении слова (если есть)
          items:
            type: string
    Word:
      type: object
      required: [lemma, pos, level, levels, inCards]
      properties:
        lemma:
          type: string
        pos:
          type: string
        inCards:
          type: boolean
          description: Есть ли у пользователя карточка этого слова
        frequencyRank:
          type: integer
          minimum: 1
          description: >
            Место слова в списке частот (1 — самое частое): лучшее среди его форм. Нет, если слова нет в списке
            (реже 50 000-го) или это фраза.
        level:
          $ref: "#/components/schemas/CefrLevel"
          description: Уровень слова — самый низкий из оценок источников
        levels:
          type: array
          description: Оценки по источникам
          items:
            $ref: "#/components/schemas/WordLevel"
    WordList:
      type: object
      required: [words]
      properties:
        words:
          type: array
          items:
            $ref: "#/components/schemas/Word"
    ExampleSentence:
      type: object
      required: [text, author, tatoebaId]
      properties:
        text:
          type: string
        author:
          type: string
          description: Автор предложения на Tatoeba (атрибуция по лицензии CC BY)
        tatoebaId:
          type: integer
          format: int64
          description: Номер предложения на tatoeba.org
    TextRange:
      type: object
      required: [start, end]
      properties:
        start:
          type: integer
          description: Начало в символах (не в байтах), включительно
        end:
          type: integer
          description: Конец в символах, не включается
    Example:
      type: object
      required: [en, ru]
      properties:
        en:
          $ref: "#/components/schemas/ExampleSentence"
        ru:
          $ref: "#/components/schemas/ExampleSentence"
        highlight:
          $ref: "#/components/schemas/TextRange"
          description: Где в английском предложении найденное слово; нет, если место определить не удалось
    ExampleList:
      type: object
      required: [examples]
      properties:
        examples:
          type: array
          items:
            $ref: "#/components/schemas/Example"
    AddCardRequest:
      type: object
      required: [lemma, pos]
      properties:
        lemma:
          type: string
          maxLength: 64
        pos:
          type: string
          maxLength: 32
    AddCardResponse:
      type: object
      required: [cardId, created]
      properties:
        cardId:
          type: integer
          format: int64
        created:
          type: boolean
    ReviewCardRequest:
      type: object
      required: [cardId, rating, key]
      properties:
        cardId:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 4
          description: 1 забыл, 2 трудно, 3 хорошо, 4 легко
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: Ключ идемпотентности; клиент создаёт новый для каждой показанной карточки
    CardSentence:
      type: object
      required: [en, ru, gap]
      properties:
        en:
          $ref: "#/components/schemas/ExampleSentence"
        ru:
          $ref: "#/components/schemas/ExampleSentence"
        gap:
          $ref: "#/components/schemas/TextRange"
          description: Где в английском предложении слово (его скрывает пропуск), в символах
    CardIntervals:
      type: object
      description: Через сколько секунд карточка вернётся при каждой оценке
      required: [again, hard, good, easy]
      properties:
        again:
          type: integer
          format: int64
        hard:
          type: integer
          format: int64
        good:
          type: integer
          format: int64
        easy:
          type: integer
          format: int64
    QueueCard:
      type: object
      required: [cardId, lemma, pos, level, state, intervals]
      properties:
        cardId:
          type: integer
          format: int64
        lemma:
          type: string
        pos:
          type: string
        level:
          $ref: "#/components/schemas/CefrLevel"
        state:
          type: integer
          description: 0 новая, 1 обучение, 2 повторение, 3 переобучение
        sentence:
          $ref: "#/components/schemas/CardSentence"
          description: Предложение с пропуском; нет, если подходящих примеров не нашлось
        intervals:
          $ref: "#/components/schemas/CardIntervals"
    CardQueue:
      type: object
      required: [dueCount, totalCount]
      properties:
        dueCount:
          type: integer
          format: int64
          description: Сколько карточек к повторению сейчас
        totalCount:
          type: integer
          format: int64
          description: Сколько карточек всего
        card:
          $ref: "#/components/schemas/QueueCard"
          description: Следующая карточка; нет, если повторять нечего
    Exercise:
      type: object
      required: [id, kind, prompt, translation, choices, topic]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [gap, order, form]
          description: >
            Вид упражнения. gap — пропуск в предложении, order — собрать предложение из плиток,
            form — выбрать верную форму слова (в prompt пропуск, в hint начальная форма)
        prompt:
          type: string
          description: >
            gap — предложение с пропуском (английский); order — русское предложение, которое нужно перевести
            (собрать по-английски из tiles)
        translation:
          type: string
          description: Перевод-подсказка на русском
        choices:
          type: array
          items:
            type: string
          description: Варианты ответа; пустой список — ответ вводится вручную (для order всегда пустой)
        tiles:
          type: array
          items:
            type: string
          description: >
            Только для order: слова английского предложения в перемешанном порядке (первое слово строчное,
            завершающей точки нет). Верный порядок до ответа клиенту не отдаётся
        hint:
          type: string
          description: Только для form, начальная форма слова, которую нужно изменить
        topic:
          type: string
          description: Основная тема упражнения
        repeat:
          type: boolean
          description: Это повтор ошибки из банка ошибок
    AnswerRequest:
      type: object
      required: [exerciseId, given, key]
      properties:
        exerciseId:
          type: integer
          format: int64
        given:
          type: string
          minLength: 1
          maxLength: 200
          description: Ответ пользователя; для order — собранное предложение строкой (слова через пробел)
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: Ключ идемпотентности, один на попытку
    Rating:
      type: object
      required: [topic, rating, deviation, attempts]
      properties:
        topic:
          type: string
        rating:
          type: number
          format: double
        deviation:
          type: number
          format: double
        attempts:
          type: integer
          minimum: 0
    AnswerResult:
      type: object
      required: [correct, answer, translation, ratings]
      properties:
        correct:
          type: boolean
        answer:
          type: string
          description: Верный ответ
        translation:
          type: string
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/Rating"
          description: Рейтинги затронутых тем после обновления
        word:
          type: object
          required: [lemma, pos, inCards]
          description: Только для form, слово упражнения (чтобы добавить его в карточки)
          properties:
            lemma:
              type: string
            pos:
              type: string
            inCards:
              type: boolean
              description: Слово уже есть в карточках пользователя
        mistake:
          $ref: "#/components/schemas/MistakeResult"
    MistakeResult:
      type: object
      required: [status, streak, nextDue]
      description: Состояние ошибки после ответа (повтор или новый неверный ответ)
      properties:
        status:
          type: string
          enum: [open, closed]
        streak:
          type: integer
          minimum: 0
          maximum: 2
          description: Верных повторов подряд
        nextDue:
          type: string
          format: date-time
          description: Когда ошибка вернётся (для закрытой — последний срок)
    Mistake:
      type: object
      required: [id, topic, kind, prompt, given, answer, streak, nextDue, firstWrongAt]
      properties:
        id:
          type: integer
          format: int64
        topic:
          type: string
          description: Основная тема ошибки
        kind:
          type: string
          description: Вид упражнения (gap, order или form, как у Exercise.kind)
        prompt:
          type: string
          description: Предложение с пропуском (gap, form) или русский перевод (order)
        given:
          type: string
          description: Последний неверный ответ
        answer:
          type: string
          description: Верный ответ
        streak:
          type: integer
          minimum: 0
          maximum: 2
        nextDue:
          type: string
          format: date-time
        firstWrongAt:
          type: string
          format: date-time
    MistakeCounts:
      type: object
      required: [open, dueNow, closedThisWeek]
      properties:
        open:
          type: integer
          format: int64
          description: Все открытые ошибки (не только показанные)
        dueNow:
          type: integer
          format: int64
          description: Ждут повтора сейчас
        closedThisWeek:
          type: integer
          format: int64
    MistakeList:
      type: object
      required: [open, counts]
      properties:
        open:
          type: array
          items:
            $ref: "#/components/schemas/Mistake"
          description: Открытые ошибки по сроку повтора, не больше 200
        counts:
          $ref: "#/components/schemas/MistakeCounts"
    TodayCounts:
      type: object
      required: [answers, correct, cardsReviewed, mistakesOpened, mistakesClosed]
      properties:
        answers:
          type: integer
          description: Ответов на упражнения за сегодня
        correct:
          type: integer
          description: Из них верных
        cardsReviewed:
          type: integer
        mistakesOpened:
          type: integer
        mistakesClosed:
          type: integer
    ProgressToday:
      type: object
      required: [minutes, minimumDay, goalMinutes, doneToday, streakDays, today]
      properties:
        minutes:
          type: number
          description: Минут занятий за сегодня (одна десятая)
        minimumDay:
          type: integer
          description: Сколько минут нужно для «минимального дня»
        goalMinutes:
          type: integer
          description: Цель дня из настроек (без настроек 15)
        doneToday:
          type: boolean
        streakDays:
          type: integer
          description: Серия, сутки подряд с выполненным минимумом (не больше 60)
        freezeUsedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Последний пропуск, прощённый «заморозкой» (YYYY-MM-DD); нет поля, если заморозка не использовалась
        today:
          $ref: "#/components/schemas/TodayCounts"
    TopicList:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Rating"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Машинный код ошибки
              enum: [invalid_request, invalid_credentials, forbidden_origin, too_many_attempts, busy, unauthorized, onboarding_required, no_examples, word_not_found, not_found, no_exercise, already_answered, invalid_answer, internal]
            message:
              type: string
              description: Текст для пользователя на русском
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нет действующей сессии или неверные данные для входа
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Запрос с чужого источника (Origin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
